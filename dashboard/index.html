ss=\"inline-code\">HEARTBEAT_OK</code> every time. Use heartbeats productively!</p>\n<p class=\"md-p\">You are free to edit <code class=\"inline-code\">HEARTBEAT.md</code> with a short checklist or reminders. Keep it small to limit token burn.</p>\n<h3 class=\"md-h3\">Heartbeat vs Cron: When to Use Each</h3>\n<p class=\"md-p\"><strong>Use heartbeat when:</strong></p>\n<ul class=\"md-list\"><li>Multiple checks can batch together (inbox + calendar + notifications in one turn)</li><li>You need conversational context from recent messages</li><li>Timing can drift slightly (every ~30 min is fine, not exact)</li><li>You want to reduce API calls by combining periodic checks</li></ul>\n<p class=\"md-p\"><strong>Use cron when:</strong></p>\n<ul class=\"md-list\"><li>Exact timing matters (\"9:00 AM sharp every Monday\")</li><li>Task needs isolation from main session history</li><li>You want a different model or thinking level for the task</li><li>One-shot reminders (\"remind me in 20 minutes\")</li><li>Output should deliver directly to a channel without main session involvement</li></ul>\n<p class=\"md-p\"><strong>Tip:</strong> Batch similar periodic checks into <code class=\"inline-code\">HEARTBEAT.md</code> instead of creating multiple cron jobs. Use cron for precise schedules and standalone tasks.</p>\n<p class=\"md-p\"><strong>Things to check (rotate through these, 2-4 times per day):</strong></p>\n<ul class=\"md-list\"><li><strong>Emails</strong> - Any urgent unread messages?</li><li><strong>Calendar</strong> - Upcoming events in next 24-48h?</li><li><strong>Mentions</strong> - Twitter/social notifications?</li><li><strong>Weather</strong> - Relevant if your human might go out?</li></ul>\n<p class=\"md-p\"><strong>Track your checks</strong> in <code class=\"inline-code\">memory/heartbeat-state.json</code>:</p>\n<pre class=\"code-block\"><code class=\"lang-json\">{\n  \"lastChecks\": {\n    \"email\": 1703275200,\n    \"calendar\": 1703260800,\n    \"weather\": null\n  }\n}</code></pre>\n<p class=\"md-p\"><strong>When to reach out:</strong></p>\n<ul class=\"md-list\"><li>Important email arrived</li><li>Calendar event coming up (&lt;2h)</li><li>Something interesting you found</li><li>It's been >8h since you said anything</li></ul>\n<p class=\"md-p\"><strong>When to stay quiet (HEARTBEAT_OK):</strong></p>\n<ul class=\"md-list\"><li>Late night (23:00-08:00) unless urgent</li><li>Human is clearly busy</li><li>Nothing new since last check</li><li>You just checked &lt;30 minutes ago</li></ul>\n<p class=\"md-p\"><strong>Proactive work you can do without asking:</strong></p>\n<ul class=\"md-list\"><li>Read and organize memory files</li><li>Check on projects (git status, etc.)</li><li>Update documentation</li><li>Commit and push your own changes</li><li><strong>Review and update MEMORY.md</strong> (see below)</li></ul>\n<h3 class=\"md-h3\">🔄 Memory Maintenance (During Heartbeats)</h3>\n<p class=\"md-p\">Periodically (every few days), use a heartbeat to:</p>\n<ol class=\"md-list\"><li>Read through recent <code class=\"inline-code\">memory/YYYY-MM-DD.md</code> files</li><li>Identify significant events, lessons, or insights worth keeping long-term</li><li>Update <code class=\"inline-code\">MEMORY.md</code> with distilled learnings</li><li>Remove outdated info from MEMORY.md that's no longer relevant</li></ol>\n<p class=\"md-p\">Think of it like a human reviewing their journal and updating their mental model. Daily files are raw notes; MEMORY.md is curated wisdom.</p>\n<p class=\"md-p\">The goal: Be helpful without being annoying. Check in a few times a day, do useful background work, but respect quiet time.</p>\n<h2 class=\"md-h2\">Make It Yours</h2>\n<p class=\"md-p\">This is a starting point. Add your own conventions, style, and rules as you figure out what works.</p>\n<h2 class=\"md-h2\">Related</h2>\n<ul class=\"md-list\"><li><span class=\\\"md-link\\\">Default AGENTS.md</span></li></ul>"}, "sk_calendar": {"key": "sk_calendar", "label": "📅 calendar", "sections": [{"title": "Description", "html": "<p class=\"md-p\">日历日程管理技能。基于 <code class=\"inline-code\">core/cal_manager.py</code> 提供日程的增删改查、冲突检测、空闲时段查询。所有操作通过 CLI 工具完成，不直接读写 JSON 文件。</p>"}, {"title": "Trigger", "html": "<p class=\"md-p\">当用户提到：日程、日历、安排、提醒、空闲、忙不忙、有没有事、冲突等时间管理相关关键词时触发。</p>"}, {"title": "⚠️ 重要：禁止直接读写 calendar.json", "html": "<p class=\"md-p\"><strong>永远不要</strong>用 <code class=\"inline-code\">read</code>、<code class=\"inline-code\">find</code>、<code class=\"inline-code\">cat</code> 等方式直接读取 <code class=\"inline-code\">calendar.json</code>。</p>\n<p class=\"md-p\"><strong>必须</strong>通过下方的 CLI 工具操作日历。</p>"}, {"title": "⚠️ 数据呈现约束（硬约束）", "html": "<p class=\"md-p\">播报输出中的日期、时间、地点等事实性数据，必须沿用脚本原文，禁止模型自行推算或转述。</p>\n<ul class=\"md-list\"><li>脚本说\"周六\"，回复就必须写\"周六\"，不能自己改成\"周五\"</li><li>日程、天气等数据，直接引用或精简原文，不要重新组织事实</li><li>如果需要引用日期/时间，从工具输出中逐字复制，不要凭记忆或推算</li></ul>\n<p class=\"md-p\"><strong>原因：</strong> 模型在转述事实数据时会产生幻觉（hallucination），尤其是日期、星期、数字。沿用原文可以彻底消除这类错误。</p>\n<h3 class=\"md-h3\">微信 emoji 约束</h3>\n<p class=\"md-p\">禁止输出带数字的 emoji：❌ 📆 🔢</p>\n<p class=\"md-p\">日程/时间统一用：✅ 📅 📋 🕐 ⏰ 📌</p>"}, {"title": "⚠️ 日期解析 fallback（硬约束）", "html": "<p class=\"md-p\">用户提到的自然语言日期必须经过 <code class=\"inline-code\">date<em>resolver.resolve</em>date()</code> 或 <code class=\"inline-code\">cal_manager</code> 内部调用链解析。</p>\n<ul class=\"md-list\"><li><strong>解析成功</strong> → 用返回的 ISO 日期继续流程</li><li><strong>解析失败（返回 None）</strong> → 向用户反问具体日期，禁止自行推算。示例：\"你说的具体是哪天？给我一个日期就行，比如'6月10号'或者'下周六'\"</li><li><strong>模糊表达</strong>（\"月底\"、\"端午节\"、\"有空的时候\"）→ 同样反问，不要自行推算节假日或模糊时间</li><li><strong>禁止</strong> LLM 自行执行\"今天是周一所以下周三是X号\"这类推算</li></ul>"}, {"title": "Script", "html": "<pre class=\"code-block\"><code class=\"lang-bash\"># 查询日程\npython {baseDir}/scripts/calendar_cli.py today\npython {baseDir}/scripts/calendar_cli.py tomorrow\npython {baseDir}/scripts/calendar_cli.py list --days 7\npython {baseDir}/scripts/calendar_cli.py list --date 2026-05-26\n\n# 查询空闲时段\npython {baseDir}/scripts/calendar_cli.py free\npython {baseDir}/scripts/calendar_cli.py free --date 2026-05-26\n\n# 添加日程（自然语言）\npython {baseDir}/scripts/calendar_cli.py add \"周六下午3点到5点开会\" --location \"公司会议室\"\n\n# 删除日程\npython {baseDir}/scripts/calendar_cli.py delete &lt;event_id&gt;\n\n# 更新日程\npython {baseDir}/scripts/calendar_cli.py update &lt;event_id&gt; --title \"新标题\" --location \"新地点\"\n\n# 冲突检测\npython {baseDir}/scripts/calendar_cli.py check \"2026-05-26T15:00:00\" \"2026-05-26T17:00:00\"\n\n# 导入 iCal 文件\npython {baseDir}/scripts/calendar_cli.py import /path/to/file.ics\n\n# 智能取消日程（模糊匹配，无需 event_id）\npython {baseDir}/scripts/calendar_cli.py cancel \"医院\"      # 匹配标题/地点/描述含「医院」的日程\npython {baseDir}/scripts/calendar_cli.py cancel \"开会\"      # 匹配含「开会」的日程\npython {baseDir}/scripts/calendar_cli.py cancel --next    # 取消最近一个未来日程\npython {baseDir}/scripts/calendar_cli.py cancel --today   # 取消今天所有日程\n\n# 输出 JSON 格式（方便程序处理）\npython {baseDir}/scripts/calendar_cli.py --json today\npython {baseDir}/scripts/calendar_cli.py --json list --days 3</code></pre>"}, {"title": "Output", "html": "<p class=\"md-p\">默认输出格式化文本（适配微信），加 <code class=\"inline-code\">--json</code> 参数输出 JSON。</p>"}, {"title": "Constraints", "html": "<ul class=\"md-list\"><li>所有日历操作必须通过 CLI 工具，不直接操作 JSON 文件</li><li>查询类操作用 <code class=\"inline-code\">exec</code> 工具调用上面的脚本</li><li>添加/删除/更新操作也通过 <code class=\"inline-code\">exec</code> 调用</li></ul>"}, {"title": "⚠️ 日程创建约束（硬约束）", "html": "<p class=\"md-p\">创建日程时，<strong>必须先确认时间再创建</strong>：</p>\n<ul class=\"md-list\"><li>如果用户明确说了时间（如\"明天下午3点\"）→ 直接创建</li><li>如果用户没说时间或表达模糊（如\"明天建个日程思考XX\"）→ <strong>必须先建议时间，等用户确认后再创建</strong></li><li>建议格式：\"建议安排在XX点到XX点，时间要调吗？\"</li><li><strong>禁止：</strong> 自行推断时间后直接创建。宁可问一句，不要猜。</li></ul>\n<p class=\"md-p\"><code class=\"inline-code\">calendar<em>cli.py add</code> 输出 JSON 格式，含 <code class=\"inline-code\">event</em>id</code>。<strong>只有工具返回 <code class=\"inline-code\">ok=true</code> 且有 <code class=\"inline-code\">event_id</code> 时，才能回复\"已创建\"。禁止在工具返回前确认。</strong></p>"}, {"title": "⚠️ 日程取消约束（硬约束）", "html": "<p class=\"md-p\">当用户表达完成/取消意图时（如\"完成了\"、\"做完了\"、\"搞定了\"、\"不用了\"、\"取消\"、\"已经xxx了\"等），<strong>立即执行 cancel 命令，不要反问</strong>：</p>\n<pre class=\"code-block\"><code class=\"lang-bash\">python {baseDir}/scripts/calendar_cli.py cancel \"&lt;关键词&gt;\"</code></pre>\n<ul class=\"md-list\"><li>关键词来自用户原话（如\"医院检查做完了\" → 关键词\"医院\"）</li><li>如果无法确定关键词，用 <code class=\"inline-code\">cancel --next</code> 取消最近一个日程</li><li>简短确认：\"已取消 ✅\"</li><li><strong>禁止：</strong> 反问用户\"要取消哪个\"、\"确认取消吗\"。直接做。</li></ul>"}, {"title": "⚠️ 日程创建防幻觉（硬约束）", "html": "<p class=\"md-p\"><code class=\"inline-code\">calendar_cli.py add</code> 始终输出结构化 JSON：</p>\n<pre class=\"code-block\"><code class=\"lang-json\">{\"ok\": true, \"event_id\": \"abc12345\", \"title\": \"开会\", \"start_time\": \"2026-06-05T15:00:00\", \"end_time\": \"2026-06-05T17:00:00\", \"location\": \"\"}</code></pre>\n<h3 class=\"md-h3\">校验规则</h3>\n<ul class=\"md-list\"><li><strong>只有 <code class=\"inline-code\">ok=true</code> 且有 <code class=\"inline-code\">event_id</code> 时</strong>，才能回复“已创建”</li><li><strong>确认回复必须引用返回的 title 和 start_time</strong>（沿用原文，不要自行格式化）</li><li><strong>如果工具未返回 event_id 或 <code class=\"inline-code\">ok=false</code></strong>，禁止编造“已创建”</li><li><strong>禁止在工具调用结果返回前说“已创建”</strong></li></ul>\n<h3 class=\"md-h3\">原因</h3>\n<p class=\"md-p\">LLM 存在“顺应性幻觉”——对话流程到了“该确认创建”的节点，会倾向于生成“已创建”，即使工具未实际执行。结构化 JSON + event_id 校验可根治此问题。</p>\n<h3 class=\"md-h3\">正确示例</h3>\n<pre class=\"code-block\"><code class=\"lang-text\">✅ 已创建：开会，06月05日(周五) 15:00-17:00</code></pre>\n<h3 class=\"md-h3\">错误示例</h3>\n<pre class=\"code-block\"><code class=\"lang-text\">❌ \"已创建\" （工具未返回 event_id，禁止编造）\n❌ 工具调用结果返回前就确认创建</code></pre>\n<hr class=\"md-hr\">"}, {"title": "Broadcast（播报消息生成）", "html": "<p class=\"md-p\">统一格式的早安/晚安/天气预警消息生成器。emoji 和格式全部写死在脚本中，模型只需调用脚本并原样发送输出。</p>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 早安播报（天气+今日日程+每日打卡提醒）\npython {baseDir}/scripts/broadcast.py morning\n\n# 晚安播报（明日天气+当日日程+每日打卡提醒）\npython {baseDir}/scripts/broadcast.py evening\n\n# 天气预警（异常天气时输出，正常时无输出）\npython {baseDir}/scripts/broadcast.py alert</code></pre>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 预订到店提醒（2小时内有预订时输出）\npython {baseDir}/scripts/broadcast.py booking\n\n# 待评价提醒（有已完成但未评价的预订时输出）\npython {baseDir}/scripts/broadcast.py review\n\n# 天气-日程冲突检测（恶劣天气+户外日程时输出）\npython {baseDir}/scripts/broadcast.py weather-check</code></pre>\n<h3 class=\"md-h3\">规则</h3>\n<ul class=\"md-list\"><li>调用脚本后，将输出<strong>原样发送</strong>给用户，不要添加、修改、省略任何内容</li><li>alert/booking/review/weather-check 无输出时，表示没有需要提醒的内容，不要发送任何消息</li><li>脚本内部已处理：天气获取、日程查询、预订检查、emoji 分配、格式统一</li></ul>"}], "full_html": "<h1 class=\"md-h1\">Calendar Skill</h1>\n<h2 class=\"md-h2\">Description</h2>\n<p class=\"md-p\">日历日程管理技能。基于 <code class=\"inline-code\">core/cal_manager.py</code> 提供日程的增删改查、冲突检测、空闲时段查询。所有操作通过 CLI 工具完成，不直接读写 JSON 文件。</p>\n<h2 class=\"md-h2\">Trigger</h2>\n<p class=\"md-p\">当用户提到：日程、日历、安排、提醒、空闲、忙不忙、有没有事、冲突等时间管理相关关键词时触发。</p>\n<h2 class=\"md-h2\">⚠️ 重要：禁止直接读写 calendar.json</h2>\n<p class=\"md-p\"><strong>永远不要</strong>用 <code class=\"inline-code\">read</code>、<code class=\"inline-code\">find</code>、<code class=\"inline-code\">cat</code> 等方式直接读取 <code class=\"inline-code\">calendar.json</code>。</p>\n<p class=\"md-p\"><strong>必须</strong>通过下方的 CLI 工具操作日历。</p>\n<h2 class=\"md-h2\">⚠️ 数据呈现约束（硬约束）</h2>\n<p class=\"md-p\">播报输出中的日期、时间、地点等事实性数据，必须沿用脚本原文，禁止模型自行推算或转述。</p>\n<ul class=\"md-list\"><li>脚本说\"周六\"，回复就必须写\"周六\"，不能自己改成\"周五\"</li><li>日程、天气等数据，直接引用或精简原文，不要重新组织事实</li><li>如果需要引用日期/时间，从工具输出中逐字复制，不要凭记忆或推算</li></ul>\n<p class=\"md-p\"><strong>原因：</strong> 模型在转述事实数据时会产生幻觉（hallucination），尤其是日期、星期、数字。沿用原文可以彻底消除这类错误。</p>\n<h3 class=\"md-h3\">微信 emoji 约束</h3>\n<p class=\"md-p\">禁止输出带数字的 emoji：❌ 📆 🔢</p>\n<p class=\"md-p\">日程/时间统一用：✅ 📅 📋 🕐 ⏰ 📌</p>\n<h2 class=\"md-h2\">⚠️ 日期解析 fallback（硬约束）</h2>\n<p class=\"md-p\">用户提到的自然语言日期必须经过 <code class=\"inline-code\">date<em>resolver.resolve</em>date()</code> 或 <code class=\"inline-code\">cal_manager</code> 内部调用链解析。</p>\n<ul class=\"md-list\"><li><strong>解析成功</strong> → 用返回的 ISO 日期继续流程</li><li><strong>解析失败（返回 None）</strong> → 向用户反问具体日期，禁止自行推算。示例：\"你说的具体是哪天？给我一个日期就行，比如'6月10号'或者'下周六'\"</li><li><strong>模糊表达</strong>（\"月底\"、\"端午节\"、\"有空的时候\"）→ 同样反问，不要自行推算节假日或模糊时间</li><li><strong>禁止</strong> LLM 自行执行\"今天是周一所以下周三是X号\"这类推算</li></ul>\n<h2 class=\"md-h2\">Script</h2>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 查询日程\npython {baseDir}/scripts/calendar_cli.py today\npython {baseDir}/scripts/calendar_cli.py tomorrow\npython {baseDir}/scripts/calendar_cli.py list --days 7\npython {baseDir}/scripts/calendar_cli.py list --date 2026-05-26\n\n# 查询空闲时段\npython {baseDir}/scripts/calendar_cli.py free\npython {baseDir}/scripts/calendar_cli.py free --date 2026-05-26\n\n# 添加日程（自然语言）\npython {baseDir}/scripts/calendar_cli.py add \"周六下午3点到5点开会\" --location \"公司会议室\"\n\n# 删除日程\npython {baseDir}/scripts/calendar_cli.py delete &lt;event_id&gt;\n\n# 更新日程\npython {baseDir}/scripts/calendar_cli.py update &lt;event_id&gt; --title \"新标题\" --location \"新地点\"\n\n# 冲突检测\npython {baseDir}/scripts/calendar_cli.py check \"2026-05-26T15:00:00\" \"2026-05-26T17:00:00\"\n\n# 导入 iCal 文件\npython {baseDir}/scripts/calendar_cli.py import /path/to/file.ics\n\n# 智能取消日程（模糊匹配，无需 event_id）\npython {baseDir}/scripts/calendar_cli.py cancel \"医院\"      # 匹配标题/地点/描述含「医院」的日程\npython {baseDir}/scripts/calendar_cli.py cancel \"开会\"      # 匹配含「开会」的日程\npython {baseDir}/scripts/calendar_cli.py cancel --next    # 取消最近一个未来日程\npython {baseDir}/scripts/calendar_cli.py cancel --today   # 取消今天所有日程\n\n# 输出 JSON 格式（方便程序处理）\npython {baseDir}/scripts/calendar_cli.py --json today\npython {baseDir}/scripts/calendar_cli.py --json list --days 3</code></pre>\n<h2 class=\"md-h2\">Output</h2>\n<p class=\"md-p\">默认输出格式化文本（适配微信），加 <code class=\"inline-code\">--json</code> 参数输出 JSON。</p>\n<h2 class=\"md-h2\">Constraints</h2>\n<ul class=\"md-list\"><li>所有日历操作必须通过 CLI 工具，不直接操作 JSON 文件</li><li>查询类操作用 <code class=\"inline-code\">exec</code> 工具调用上面的脚本</li><li>添加/删除/更新操作也通过 <code class=\"inline-code\">exec</code> 调用</li></ul>\n<h2 class=\"md-h2\">⚠️ 日程创建约束（硬约束）</h2>\n<p class=\"md-p\">创建日程时，<strong>必须先确认时间再创建</strong>：</p>\n<ul class=\"md-list\"><li>如果用户明确说了时间（如\"明天下午3点\"）→ 直接创建</li><li>如果用户没说时间或表达模糊（如\"明天建个日程思考XX\"）→ <strong>必须先建议时间，等用户确认后再创建</strong></li><li>建议格式：\"建议安排在XX点到XX点，时间要调吗？\"</li><li><strong>禁止：</strong> 自行推断时间后直接创建。宁可问一句，不要猜。</li></ul>\n<p class=\"md-p\"><code class=\"inline-code\">calendar<em>cli.py add</code> 输出 JSON 格式，含 <code class=\"inline-code\">event</em>id</code>。<strong>只有工具返回 <code class=\"inline-code\">ok=true</code> 且有 <code class=\"inline-code\">event_id</code> 时，才能回复\"已创建\"。禁止在工具返回前确认。</strong></p>\n<h2 class=\"md-h2\">⚠️ 日程取消约束（硬约束）</h2>\n<p class=\"md-p\">当用户表达完成/取消意图时（如\"完成了\"、\"做完了\"、\"搞定了\"、\"不用了\"、\"取消\"、\"已经xxx了\"等），<strong>立即执行 cancel 命令，不要反问</strong>：</p>\n<pre class=\"code-block\"><code class=\"lang-bash\">python {baseDir}/scripts/calendar_cli.py cancel \"&lt;关键词&gt;\"</code></pre>\n<ul class=\"md-list\"><li>关键词来自用户原话（如\"医院检查做完了\" → 关键词\"医院\"）</li><li>如果无法确定关键词，用 <code class=\"inline-code\">cancel --next</code> 取消最近一个日程</li><li>简短确认：\"已取消 ✅\"</li><li><strong>禁止：</strong> 反问用户\"要取消哪个\"、\"确认取消吗\"。直接做。</li></ul>\n<h2 class=\"md-h2\">⚠️ 日程创建防幻觉（硬约束）</h2>\n<p class=\"md-p\"><code class=\"inline-code\">calendar_cli.py add</code> 始终输出结构化 JSON：</p>\n<pre class=\"code-block\"><code class=\"lang-json\">{\"ok\": true, \"event_id\": \"abc12345\", \"title\": \"开会\", \"start_time\": \"2026-06-05T15:00:00\", \"end_time\": \"2026-06-05T17:00:00\", \"location\": \"\"}</code></pre>\n<h3 class=\"md-h3\">校验规则</h3>\n<ul class=\"md-list\"><li><strong>只有 <code class=\"inline-code\">ok=true</code> 且有 <code class=\"inline-code\">event_id</code> 时</strong>，才能回复“已创建”</li><li><strong>确认回复必须引用返回的 title 和 start_time</strong>（沿用原文，不要自行格式化）</li><li><strong>如果工具未返回 event_id 或 <code class=\"inline-code\">ok=false</code></strong>，禁止编造“已创建”</li><li><strong>禁止在工具调用结果返回前说“已创建”</strong></li></ul>\n<h3 class=\"md-h3\">原因</h3>\n<p class=\"md-p\">LLM 存在“顺应性幻觉”——对话流程到了“该确认创建”的节点，会倾向于生成“已创建”，即使工具未实际执行。结构化 JSON + event_id 校验可根治此问题。</p>\n<h3 class=\"md-h3\">正确示例</h3>\n<pre class=\"code-block\"><code class=\"lang-text\">✅ 已创建：开会，06月05日(周五) 15:00-17:00</code></pre>\n<h3 class=\"md-h3\">错误示例</h3>\n<pre class=\"code-block\"><code class=\"lang-text\">❌ \"已创建\" （工具未返回 event_id，禁止编造）\n❌ 工具调用结果返回前就确认创建</code></pre>\n<hr class=\"md-hr\">\n<h2 class=\"md-h2\">Broadcast（播报消息生成）</h2>\n<p class=\"md-p\">统一格式的早安/晚安/天气预警消息生成器。emoji 和格式全部写死在脚本中，模型只需调用脚本并原样发送输出。</p>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 早安播报（天气+今日日程+每日打卡提醒）\npython {baseDir}/scripts/broadcast.py morning\n\n# 晚安播报（明日天气+当日日程+每日打卡提醒）\npython {baseDir}/scripts/broadcast.py evening\n\n# 天气预警（异常天气时输出，正常时无输出）\npython {baseDir}/scripts/broadcast.py alert</code></pre>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 预订到店提醒（2小时内有预订时输出）\npython {baseDir}/scripts/broadcast.py booking\n\n# 待评价提醒（有已完成但未评价的预订时输出）\npython {baseDir}/scripts/broadcast.py review\n\n# 天气-日程冲突检测（恶劣天气+户外日程时输出）\npython {baseDir}/scripts/broadcast.py weather-check</code></pre>\n<h3 class=\"md-h3\">规则</h3>\n<ul class=\"md-list\"><li>调用脚本后，将输出<strong>原样发送</strong>给用户，不要添加、修改、省略任何内容</li><li>alert/booking/review/weather-check 无输出时，表示没有需要提醒的内容，不要发送任何消息</li><li>脚本内部已处理：天气获取、日程查询、预订检查、emoji 分配、格式统一</li></ul>"}, "sk_food": {"key": "sk_food", "label": "🍣 food-finder", "sections": [{"title": "Description", "html": "<p class=\"md-p\">本地生活美食推荐技能。根据用户的口味偏好、预算、位置、时间段等条件，推荐合适的餐厅。支持多轮对话细化需求，集成记忆系统学习用户偏好。</p>"}, {"title": "Trigger", "html": "<p class=\"md-p\">当用户提到：吃、餐厅、美食、饿了、午餐、晚餐、夜宵、火锅、烧烤、小吃等餐饮相关关键词时触发。</p>"}, {"title": "Input Parameters", "html": "<ul class=\"md-list\"><li><code class=\"inline-code\">query</code> (string): 用户的自然语言描述，如\"想吃辣的，人均50以内\"</li><li><code class=\"inline-code\">location</code> (string, optional): 用户位置或区域</li><li><code class=\"inline-code\">budget</code> (string, optional): 人均预算范围</li><li><code class=\"inline-code\">cuisine</code> (string, optional): 菜系偏好</li><li><code class=\"inline-code\">time<em>of</em>day</code> (string, optional): 用餐时段 (breakfast/lunch/dinner/late_night)</li><li><code class=\"inline-code\">mood</code> (string, optional): 用户当前心情或场景</li><li><code class=\"inline-code\">environment</code> (string, optional): 环境偏好 (quiet/noisy/moderate)</li><li><code class=\"inline-code\">family_friendly</code> (flag): 是否需要亲子友好</li><li><code class=\"inline-code\">exclude_visited</code> (flag): 排除已去过的餐厅</li></ul>"}, {"title": "Script", "html": "<pre class=\"code-block\"><code class=\"lang-bash\"># 搜索推荐\npython {baseDir}/scripts/search_restaurants.py --query \"&lt;query&gt;\" --location \"&lt;location&gt;\" --budget \"&lt;budget&gt;\" --cuisine \"&lt;cuisine&gt;\"\n\n# 排除已去过的\npython {baseDir}/scripts/search_restaurants.py --query \"&lt;query&gt;\" --exclude_visited\n\n# 记录用户选择（多轮对话）\npython {baseDir}/scripts/search_restaurants.py --choice \"&lt;restaurant_name&gt;\"\n\n# 记录一次实际访问\npython {baseDir}/scripts/search_restaurants.py --visit \"&lt;restaurant_name&gt;\" --visit_rating 4.5\n\n# 查看上次推荐\npython {baseDir}/scripts/search_restaurants.py --recall</code></pre>"}, {"title": "Output", "html": "<p class=\"md-p\">返回 JSON 格式的推荐结果：</p>\n<ul class=\"md-list\"><li>restaurant name, rating, price range, distance, cuisine type</li><li>推荐理由 (为什么推荐这家)</li><li>是否需要排队</li><li>偏好提示（基于历史学习）</li><li>可选操作：导航、预留座位</li></ul>"}, {"title": "Memory System", "html": "<p class=\"md-p\">集成 <code class=\"inline-code\">core/memory.py</code> 共享记忆模块：</p>\n<h3 class=\"md-h3\">自动记录</h3>\n<ul class=\"md-list\"><li>每次搜索自动记录交互历史</li><li>用户选择的餐厅会被学习为偏好</li></ul>\n<h3 class=\"md-h3\">偏好学习</h3>\n<p class=\"md-p\">从用户选择中学习：</p>\n<ul class=\"md-list\"><li>菜系偏好（如\"喜欢潮汕火锅\"）</li><li>环境偏好（如\"喜欢安静的环境\"）</li><li>预算偏好（如\"中等消费\"）</li><li>标签偏好（如\"清淡、新鲜\"）</li></ul>\n<h3 class=\"md-h3\">多轮对话</h3>\n<ul class=\"md-list\"><li>支持\"换一家\" → 换一批推荐</li><li>支持\"就去这家\" → 记录选择</li><li>支持\"上次那家\" → 回忆上次推荐</li></ul>\n<h3 class=\"md-h3\">访问去重</h3>\n<ul class=\"md-list\"><li><code class=\"inline-code\">--exclude_visited</code> 自动排除已去过的餐厅</li><li>基于餐厅名称和 ID 双重匹配</li></ul>"}, {"title": "Multi-turn Support", "html": "<p class=\"md-p\">支持用户追问：</p>\n<ul class=\"md-list\"><li>\"有没有更安静的？\" → 过滤环境噪音等级</li><li>\"带小孩方便吗？\" → 过滤亲子友好</li><li>\"换一家试试\" → 换一批推荐</li><li>\"上次那家也不错\" → 回忆上次推荐</li><li>\"就去这家\" → 记录选择，学习偏好</li><li>\"太辣了，不吃辣\" → 排除含辣的餐厅</li></ul>"}, {"title": "配图（推荐时必须执行）", "html": "<p class=\"md-p\">每个推荐餐厅/菜品附带一张图片，提升推荐体验。</p>\n<h3 class=\"md-h3\">流程</h3>\n<ol class=\"md-list\"><li>从推荐结果中提取餐厅名称和招牌菜名</li><li>用 <code class=\"inline-code\">web_search</code> 搜索图片：</li></ol>\n<p class=\"md-p\">   - 餐厅环境：<code class=\"inline-code\"><餐厅名> 环境 实景图</code></p>\n<p class=\"md-p\">   - 招牌菜品：<code class=\"inline-code\"><菜名> 美食图 高清</code></p>\n<ol class=\"md-list\"><li>优先从结果中找直接图片 URL（.jpg/.png/.webp 后缀）</li><li>用 <code class=\"inline-code\">message</code> 工具发送图片，caption 写简短推荐理由</li><li>多个推荐时并行搜索，不要串行等待</li></ol>\n<h3 class=\"md-h3\">搜索策略</h3>\n<ul class=\"md-list\"><li>优先搜索环境图（用户更关心餐厅氛围）</li><li>有招牌菜的再搜一张菜品图</li><li>每家餐厅最多 1-2 张图，不要刷屏</li></ul>\n<h3 class=\"md-h3\">兜底</h3>\n<ul class=\"md-list\"><li>搜不到图片时直接跳过，不要说「抱歉没找到图」</li><li>文字推荐照常输出，不受影响</li></ul>\n<h3 class=\"md-h3\">可信图片源（web_search 时必须用 site: 限定）</h3>\n<ul class=\"md-list\"><li>餐厅环境/菜品：<code class=\"inline-code\"><餐厅名> 美食图 site:dianping.com</code></li><li>备选：<code class=\"inline-code\">site:ctrip.com</code>（携程美食频道）</li><li>优先用可信站点的结果，不要用未知来源的图片</li></ul>\n<h3 class=\"md-h3\">⚠️ 搜了就必须发（防浪费规则）</h3>\n<ul class=\"md-list\"><li>如果已经调用了搜索图片的操作并且拿到了可用的图片 URL，<strong>必须用 message 工具把图发出去</strong></li><li>搜了不发 = 白搜，浪费了一次 API 调用和用户等待时间</li><li>这条规则不强制每次都搜图，但如果搜了就必须发</li></ul>"}, {"title": "Constraints", "html": "<ul class=\"md-list\"><li>所有数据来自本地模拟数据集，不调用外部 API</li><li>不收集任何真实用户信息</li><li>推荐结果不超过 3 家，附带对比说明</li><li>历史记录保留最近 200 条</li></ul>"}], "full_html": "<h1 class=\"md-h1\">Food Finder Skill</h1>\n<h2 class=\"md-h2\">Description</h2>\n<p class=\"md-p\">本地生活美食推荐技能。根据用户的口味偏好、预算、位置、时间段等条件，推荐合适的餐厅。支持多轮对话细化需求，集成记忆系统学习用户偏好。</p>\n<h2 class=\"md-h2\">Trigger</h2>\n<p class=\"md-p\">当用户提到：吃、餐厅、美食、饿了、午餐、晚餐、夜宵、火锅、烧烤、小吃等餐饮相关关键词时触发。</p>\n<h2 class=\"md-h2\">Input Parameters</h2>\n<ul class=\"md-list\"><li><code class=\"inline-code\">query</code> (string): 用户的自然语言描述，如\"想吃辣的，人均50以内\"</li><li><code class=\"inline-code\">location</code> (string, optional): 用户位置或区域</li><li><code class=\"inline-code\">budget</code> (string, optional): 人均预算范围</li><li><code class=\"inline-code\">cuisine</code> (string, optional): 菜系偏好</li><li><code class=\"inline-code\">time<em>of</em>day</code> (string, optional): 用餐时段 (breakfast/lunch/dinner/late_night)</li><li><code class=\"inline-code\">mood</code> (string, optional): 用户当前心情或场景</li><li><code class=\"inline-code\">environment</code> (string, optional): 环境偏好 (quiet/noisy/moderate)</li><li><code class=\"inline-code\">family_friendly</code> (flag): 是否需要亲子友好</li><li><code class=\"inline-code\">exclude_visited</code> (flag): 排除已去过的餐厅</li></ul>\n<h2 class=\"md-h2\">Script</h2>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 搜索推荐\npython {baseDir}/scripts/search_restaurants.py --query \"&lt;query&gt;\" --location \"&lt;location&gt;\" --budget \"&lt;budget&gt;\" --cuisine \"&lt;cuisine&gt;\"\n\n# 排除已去过的\npython {baseDir}/scripts/search_restaurants.py --query \"&lt;query&gt;\" --exclude_visited\n\n# 记录用户选择（多轮对话）\npython {baseDir}/scripts/search_restaurants.py --choice \"&lt;restaurant_name&gt;\"\n\n# 记录一次实际访问\npython {baseDir}/scripts/search_restaurants.py --visit \"&lt;restaurant_name&gt;\" --visit_rating 4.5\n\n# 查看上次推荐\npython {baseDir}/scripts/search_restaurants.py --recall</code></pre>\n<h2 class=\"md-h2\">Output</h2>\n<p class=\"md-p\">返回 JSON 格式的推荐结果：</p>\n<ul class=\"md-list\"><li>restaurant name, rating, price range, distance, cuisine type</li><li>推荐理由 (为什么推荐这家)</li><li>是否需要排队</li><li>偏好提示（基于历史学习）</li><li>可选操作：导航、预留座位</li></ul>\n<h2 class=\"md-h2\">Memory System</h2>\n<p class=\"md-p\">集成 <code class=\"inline-code\">core/memory.py</code> 共享记忆模块：</p>\n<h3 class=\"md-h3\">自动记录</h3>\n<ul class=\"md-list\"><li>每次搜索自动记录交互历史</li><li>用户选择的餐厅会被学习为偏好</li></ul>\n<h3 class=\"md-h3\">偏好学习</h3>\n<p class=\"md-p\">从用户选择中学习：</p>\n<ul class=\"md-list\"><li>菜系偏好（如\"喜欢潮汕火锅\"）</li><li>环境偏好（如\"喜欢安静的环境\"）</li><li>预算偏好（如\"中等消费\"）</li><li>标签偏好（如\"清淡、新鲜\"）</li></ul>\n<h3 class=\"md-h3\">多轮对话</h3>\n<ul class=\"md-list\"><li>支持\"换一家\" → 换一批推荐</li><li>支持\"就去这家\" → 记录选择</li><li>支持\"上次那家\" → 回忆上次推荐</li></ul>\n<h3 class=\"md-h3\">访问去重</h3>\n<ul class=\"md-list\"><li><code class=\"inline-code\">--exclude_visited</code> 自动排除已去过的餐厅</li><li>基于餐厅名称和 ID 双重匹配</li></ul>\n<h2 class=\"md-h2\">Multi-turn Support</h2>\n<p class=\"md-p\">支持用户追问：</p>\n<ul class=\"md-list\"><li>\"有没有更安静的？\" → 过滤环境噪音等级</li><li>\"带小孩方便吗？\" → 过滤亲子友好</li><li>\"换一家试试\" → 换一批推荐</li><li>\"上次那家也不错\" → 回忆上次推荐</li><li>\"就去这家\" → 记录选择，学习偏好</li><li>\"太辣了，不吃辣\" → 排除含辣的餐厅</li></ul>\n<h2 class=\"md-h2\">配图（推荐时必须执行）</h2>\n<p class=\"md-p\">每个推荐餐厅/菜品附带一张图片，提升推荐体验。</p>\n<h3 class=\"md-h3\">流程</h3>\n<ol class=\"md-list\"><li>从推荐结果中提取餐厅名称和招牌菜名</li><li>用 <code class=\"inline-code\">web_search</code> 搜索图片：</li></ol>\n<p class=\"md-p\">   - 餐厅环境：<code class=\"inline-code\"><餐厅名> 环境 实景图</code></p>\n<p class=\"md-p\">   - 招牌菜品：<code class=\"inline-code\"><菜名> 美食图 高清</code></p>\n<ol class=\"md-list\"><li>优先从结果中找直接图片 URL（.jpg/.png/.webp 后缀）</li><li>用 <code class=\"inline-code\">message</code> 工具发送图片，caption 写简短推荐理由</li><li>多个推荐时并行搜索，不要串行等待</li></ol>\n<h3 class=\"md-h3\">搜索策略</h3>\n<ul class=\"md-list\"><li>优先搜索环境图（用户更关心餐厅氛围）</li><li>有招牌菜的再搜一张菜品图</li><li>每家餐厅最多 1-2 张图，不要刷屏</li></ul>\n<h3 class=\"md-h3\">兜底</h3>\n<ul class=\"md-list\"><li>搜不到图片时直接跳过，不要说「抱歉没找到图」</li><li>文字推荐照常输出，不受影响</li></ul>\n<h3 class=\"md-h3\">可信图片源（web_search 时必须用 site: 限定）</h3>\n<ul class=\"md-list\"><li>餐厅环境/菜品：<code class=\"inline-code\"><餐厅名> 美食图 site:dianping.com</code></li><li>备选：<code class=\"inline-code\">site:ctrip.com</code>（携程美食频道）</li><li>优先用可信站点的结果，不要用未知来源的图片</li></ul>\n<h3 class=\"md-h3\">⚠️ 搜了就必须发（防浪费规则）</h3>\n<ul class=\"md-list\"><li>如果已经调用了搜索图片的操作并且拿到了可用的图片 URL，<strong>必须用 message 工具把图发出去</strong></li><li>搜了不发 = 白搜，浪费了一次 API 调用和用户等待时间</li><li>这条规则不强制每次都搜图，但如果搜了就必须发</li></ul>\n<h2 class=\"md-h2\">Constraints</h2>\n<ul class=\"md-list\"><li>所有数据来自本地模拟数据集，不调用外部 API</li><li>不收集任何真实用户信息</li><li>推荐结果不超过 3 家，附带对比说明</li><li>历史记录保留最近 200 条</li></ul>"}, "sk_entertain": {"key": "sk_entertain", "label": "🎭 entertainment", "sections": [{"title": "Description", "html": "<p class=\"md-p\">本地休闲娱乐推荐技能。根据用户兴趣、时间、天气等推荐电影、展览、演出、活动等。集成记忆系统学习用户偏好。</p>"}, {"title": "Trigger", "html": "<p class=\"md-p\">当用户提到：电影、展览、演出、活动、周末、好玩、放松、无聊、约会等娱乐相关关键词时触发。</p>"}, {"title": "Input Parameters", "html": "<ul class=\"md-list\"><li><code class=\"inline-code\">interest</code> (string, optional): 兴趣类型 (movie/exhibition/concert/sports/outdoor)</li><li><code class=\"inline-code\">time<em>range</code> (string, optional): 时间范围 (today/this</em>weekend/this_week)</li><li><code class=\"inline-code\">budget</code> (string, optional): 预算范围</li><li><code class=\"inline-code\">companion</code> (string, optional): 同行人 (solo/couple/family/friends)</li><li><code class=\"inline-code\">weather</code> (string, optional): 天气情况</li><li><code class=\"inline-code\">query</code> (string, optional): 自然语言查询（多轮对话用）</li></ul>"}, {"title": "Script", "html": "<pre class=\"code-block\"><code class=\"lang-bash\"># 搜索推荐\npython {baseDir}/scripts/find_events.py --interest \"&lt;interest&gt;\" --time \"&lt;time_range&gt;\" --budget \"&lt;budget&gt;\" --companion \"&lt;companion&gt;\"\n\n# 记录用户选择\npython {baseDir}/scripts/find_events.py --choice \"&lt;event_name&gt;\"\n\n# 记录一次实际参与\npython {baseDir}/scripts/find_events.py --visit \"&lt;event_name&gt;\" --visit_rating 4.5\n\n# 查看上次推荐\npython {baseDir}/scripts/find_events.py --recall\n\n# 获取景点/场所的 Wikipedia 图片和简介\npython {baseDir}/../core/wiki_image.py \"&lt;景点名称&gt;\"</code></pre>"}, {"title": "Output", "html": "<p class=\"md-p\">返回推荐结果：</p>\n<ul class=\"md-list\"><li>活动名称、时间、地点、价格、评分</li><li>推荐理由（为什么适合当前场景）</li><li>偏好提示（基于历史学习）</li><li>备选方案</li></ul>"}, {"title": "Memory System", "html": "<p class=\"md-p\">集成 <code class=\"inline-code\">core/memory.py</code> 共享记忆模块：</p>\n<ul class=\"md-list\"><li>自动记录每次推荐交互</li><li>学习用户偏好的活动类型和标签</li><li>支持多轮对话（换一个、就去这个）</li><li>跨技能偏好共享（美食偏好也可用于推荐参考）</li></ul>"}, {"title": "Multi-turn Support", "html": "<ul class=\"md-list\"><li>\"不想看电影了，还有别的吗？\" → 切换推荐类型</li><li>\"室外的呢？\" → 过滤户外活动</li><li>\"便宜点的\" → 筛选低价活动</li><li>\"就去这个\" → 记录选择</li><li>\"换一个\" → 换一批推荐</li></ul>"}, {"title": "配图（推荐时必须执行）", "html": "<p class=\"md-p\">每个推荐活动附带一张图片，增强吸引力。</p>\n<h3 class=\"md-h3\">主力方案：Wikipedia API（景点/景区优先）</h3>\n<p class=\"md-p\">使用 <code class=\"inline-code\">core/wiki_image.py</code> 获取图片，速度快、图片质量高、URL 稳定。</p>\n<pre class=\"code-block\"><code class=\"lang-bash\">python {baseDir}/../core/wiki_image.py \"&lt;景点名称&gt;\"</code></pre>\n<p class=\"md-p\">输出包含：<code class=\"inline-code\">image<em>url</code>（直链）、<code class=\"inline-code\">summary</code>（简介）、<code class=\"inline-code\">wiki</em>url</code>（页面链接）。</p>\n<ul class=\"md-list\"><li>景点/景区 → <strong>必须用 wiki_image</strong>，命中率高，图片质量最好</li><li>展览/演出场所 → 优先用 wiki_image，如有 Wikipedia 页面则命中</li><li>返回的 <code class=\"inline-code\">image_url</code> 直接用 <code class=\"inline-code\">message</code> 工具发送</li><li>多个推荐时并行调用脚本</li></ul>\n<h3 class=\"md-h3\">兜底方案：web_search（电影/活动/无 Wikipedia 页面时）</h3>\n<p class=\"md-p\">当 wiki<em>image 返回 <code class=\"inline-code\">found: false</code> 或推荐类型为电影/具体活动时，用 web</em>search 搜索，<strong>必须用 <code class=\"inline-code\">site:</code> 限定可信站点</strong>：</p>\n<ul class=\"md-list\"><li>景点：<code class=\"inline-code\"><景点名> 实景图 site:ctrip.com</code> 或 <code class=\"inline-code\">site:mafengwo.cn</code></li><li>电影：<code class=\"inline-code\"><电影名> 海报 site:douban.com</code></li><li>演出/活动：<code class=\"inline-code\"><活动名> site:damai.cn</code></li><li>展览：<code class=\"inline-code\"><展览名> site:douban.com</code></li></ul>\n<p class=\"md-p\">从结果页面中提取图片 URL（.jpg/.png/.webp 后缀）。优先用可信站点的结果，不要用未知来源的图片。</p>\n<h3 class=\"md-h3\">发图规则</h3>\n<ul class=\"md-list\"><li>用 <code class=\"inline-code\">message</code> 工具发送图片，caption 写简短推荐理由</li><li>每个活动最多 1 张图</li><li>搜不到图片时直接跳过，不要说「抱歉没找到图」</li><li>文字推荐照常输出，不受影响</li></ul>\n<h3 class=\"md-h3\">⚠️ 搜了就必须发（防浪费规则）</h3>\n<ul class=\"md-list\"><li>如果已经调用了 <code class=\"inline-code\">wiki<em>image.py</code> 并且返回 <code class=\"inline-code\">found: true</code> 且 <code class=\"inline-code\">image</em>url</code> 不为空，<strong>必须用 message 工具把这张图发出去</strong></li><li>搜了不发 = 白搜，浪费了一次 API 调用和用户等待时间</li><li>发图和文字推荐可以同时进行，但图片不能省略</li><li>这条规则不强制每次都搜图，但如果搜了就必须发</li></ul>"}, {"title": "Constraints", "html": "<ul class=\"md-list\"><li>所有活动数据来自模拟数据集</li><li>不收集任何真实用户信息</li><li><strong>微信 emoji 约束：</strong> 禁止 📆 🔢（带数字），日程/时间统一用 📅 📋 🕐 ⏰ 📌</li></ul>"}], "full_html": "<h1 class=\"md-h1\">Entertainment Skill</h1>\n<h2 class=\"md-h2\">Description</h2>\n<p class=\"md-p\">本地休闲娱乐推荐技能。根据用户兴趣、时间、天气等推荐电影、展览、演出、活动等。集成记忆系统学习用户偏好。</p>\n<h2 class=\"md-h2\">Trigger</h2>\n<p class=\"md-p\">当用户提到：电影、展览、演出、活动、周末、好玩、放松、无聊、约会等娱乐相关关键词时触发。</p>\n<h2 class=\"md-h2\">Input Parameters</h2>\n<ul class=\"md-list\"><li><code class=\"inline-code\">interest</code> (string, optional): 兴趣类型 (movie/exhibition/concert/sports/outdoor)</li><li><code class=\"inline-code\">time<em>range</code> (string, optional): 时间范围 (today/this</em>weekend/this_week)</li><li><code class=\"inline-code\">budget</code> (string, optional): 预算范围</li><li><code class=\"inline-code\">companion</code> (string, optional): 同行人 (solo/couple/family/friends)</li><li><code class=\"inline-code\">weather</code> (string, optional): 天气情况</li><li><code class=\"inline-code\">query</code> (string, optional): 自然语言查询（多轮对话用）</li></ul>\n<h2 class=\"md-h2\">Script</h2>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 搜索推荐\npython {baseDir}/scripts/find_events.py --interest \"&lt;interest&gt;\" --time \"&lt;time_range&gt;\" --budget \"&lt;budget&gt;\" --companion \"&lt;companion&gt;\"\n\n# 记录用户选择\npython {baseDir}/scripts/find_events.py --choice \"&lt;event_name&gt;\"\n\n# 记录一次实际参与\npython {baseDir}/scripts/find_events.py --visit \"&lt;event_name&gt;\" --visit_rating 4.5\n\n# 查看上次推荐\npython {baseDir}/scripts/find_events.py --recall\n\n# 获取景点/场所的 Wikipedia 图片和简介\npython {baseDir}/../core/wiki_image.py \"&lt;景点名称&gt;\"</code></pre>\n<h2 class=\"md-h2\">Output</h2>\n<p class=\"md-p\">返回推荐结果：</p>\n<ul class=\"md-list\"><li>活动名称、时间、地点、价格、评分</li><li>推荐理由（为什么适合当前场景）</li><li>偏好提示（基于历史学习）</li><li>备选方案</li></ul>\n<h2 class=\"md-h2\">Memory System</h2>\n<p class=\"md-p\">集成 <code class=\"inline-code\">core/memory.py</code> 共享记忆模块：</p>\n<ul class=\"md-list\"><li>自动记录每次推荐交互</li><li>学习用户偏好的活动类型和标签</li><li>支持多轮对话（换一个、就去这个）</li><li>跨技能偏好共享（美食偏好也可用于推荐参考）</li></ul>\n<h2 class=\"md-h2\">Multi-turn Support</h2>\n<ul class=\"md-list\"><li>\"不想看电影了，还有别的吗？\" → 切换推荐类型</li><li>\"室外的呢？\" → 过滤户外活动</li><li>\"便宜点的\" → 筛选低价活动</li><li>\"就去这个\" → 记录选择</li><li>\"换一个\" → 换一批推荐</li></ul>\n<h2 class=\"md-h2\">配图（推荐时必须执行）</h2>\n<p class=\"md-p\">每个推荐活动附带一张图片，增强吸引力。</p>\n<h3 class=\"md-h3\">主力方案：Wikipedia API（景点/景区优先）</h3>\n<p class=\"md-p\">使用 <code class=\"inline-code\">core/wiki_image.py</code> 获取图片，速度快、图片质量高、URL 稳定。</p>\n<pre class=\"code-block\"><code class=\"lang-bash\">python {baseDir}/../core/wiki_image.py \"&lt;景点名称&gt;\"</code></pre>\n<p class=\"md-p\">输出包含：<code class=\"inline-code\">image<em>url</code>（直链）、<code class=\"inline-code\">summary</code>（简介）、<code class=\"inline-code\">wiki</em>url</code>（页面链接）。</p>\n<ul class=\"md-list\"><li>景点/景区 → <strong>必须用 wiki_image</strong>，命中率高，图片质量最好</li><li>展览/演出场所 → 优先用 wiki_image，如有 Wikipedia 页面则命中</li><li>返回的 <code class=\"inline-code\">image_url</code> 直接用 <code class=\"inline-code\">message</code> 工具发送</li><li>多个推荐时并行调用脚本</li></ul>\n<h3 class=\"md-h3\">兜底方案：web_search（电影/活动/无 Wikipedia 页面时）</h3>\n<p class=\"md-p\">当 wiki<em>image 返回 <code class=\"inline-code\">found: false</code> 或推荐类型为电影/具体活动时，用 web</em>search 搜索，<strong>必须用 <code class=\"inline-code\">site:</code> 限定可信站点</strong>：</p>\n<ul class=\"md-list\"><li>景点：<code class=\"inline-code\"><景点名> 实景图 site:ctrip.com</code> 或 <code class=\"inline-code\">site:mafengwo.cn</code></li><li>电影：<code class=\"inline-code\"><电影名> 海报 site:douban.com</code></li><li>演出/活动：<code class=\"inline-code\"><活动名> site:damai.cn</code></li><li>展览：<code class=\"inline-code\"><展览名> site:douban.com</code></li></ul>\n<p class=\"md-p\">从结果页面中提取图片 URL（.jpg/.png/.webp 后缀）。优先用可信站点的结果，不要用未知来源的图片。</p>\n<h3 class=\"md-h3\">发图规则</h3>\n<ul class=\"md-list\"><li>用 <code class=\"inline-code\">message</code> 工具发送图片，caption 写简短推荐理由</li><li>每个活动最多 1 张图</li><li>搜不到图片时直接跳过，不要说「抱歉没找到图」</li><li>文字推荐照常输出，不受影响</li></ul>\n<h3 class=\"md-h3\">⚠️ 搜了就必须发（防浪费规则）</h3>\n<ul class=\"md-list\"><li>如果已经调用了 <code class=\"inline-code\">wiki<em>image.py</code> 并且返回 <code class=\"inline-code\">found: true</code> 且 <code class=\"inline-code\">image</em>url</code> 不为空，<strong>必须用 message 工具把这张图发出去</strong></li><li>搜了不发 = 白搜，浪费了一次 API 调用和用户等待时间</li><li>发图和文字推荐可以同时进行，但图片不能省略</li><li>这条规则不强制每次都搜图，但如果搜了就必须发</li></ul>\n<h2 class=\"md-h2\">Constraints</h2>\n<ul class=\"md-list\"><li>所有活动数据来自模拟数据集</li><li>不收集任何真实用户信息</li><li><strong>微信 emoji 约束：</strong> 禁止 📆 🔢（带数字），日程/时间统一用 📅 📋 🕐 ⏰ 📌</li></ul>"}, "sk_travel": {"key": "sk_travel", "label": "🗺️ travel-planner", "sections": [{"title": "Description", "html": "<p class=\"md-p\">本地出行规划技能。综合考虑时间、距离、费用、天气等因素，为用户推荐最优出行方案。集成记忆系统学习出行偏好。</p>"}, {"title": "Trigger", "html": "<p class=\"md-p\">当用户提到：怎么去、路线、出行、打车、地铁、公交、导航、路上、交通等关键词时触发。</p>"}, {"title": "Input Parameters", "html": "<ul class=\"md-list\"><li><code class=\"inline-code\">origin</code> (string): 出发地</li><li><code class=\"inline-code\">destination</code> (string): 目的地</li><li><code class=\"inline-code\">time</code> (string, optional): 出发时间或到达时间</li><li><code class=\"inline-code\">mode</code> (string, optional): 出行方式偏好 (walk/bus/subway/taxi/drive)</li><li><code class=\"inline-code\">priority</code> (string, optional): 优先考虑 (cost/time/comfort)</li><li><code class=\"inline-code\">query</code> (string, optional): 自然语言查询（多轮对话用）</li></ul>"}, {"title": "Script", "html": "<pre class=\"code-block\"><code class=\"lang-bash\"># 出行规划\npython {baseDir}/scripts/plan_route.py --origin \"&lt;origin&gt;\" --destination \"&lt;destination&gt;\" --time \"&lt;time&gt;\" --mode \"&lt;mode&gt;\"\n\n# 按优先级排序\npython {baseDir}/scripts/plan_route.py --origin \"&lt;origin&gt;\" --destination \"&lt;destination&gt;\" --priority \"cost\"\n\n# 记录用户选择\npython {baseDir}/scripts/plan_route.py --origin \"&lt;origin&gt;\" --destination \"&lt;destination&gt;\" --choice \"地铁\"\n\n# 查看上次推荐\npython {baseDir}/scripts/plan_route.py --origin \"x\" --destination \"y\" --recall\n\n# 获取景点/目的地的 Wikipedia 图片和简介\npython {baseDir}/../core/wiki_image.py \"&lt;景点名称&gt;\"</code></pre>"}, {"title": "Output", "html": "<p class=\"md-p\">返回对比方案：</p>\n<ul class=\"md-list\"><li>多种出行方式的时间、费用、距离对比</li><li>推荐最优方案及理由</li><li>偏好提示（基于历史学习）</li><li>到达时间预估</li></ul>"}, {"title": "Memory System", "html": "<p class=\"md-p\">集成 <code class=\"inline-code\">core/memory.py</code> 共享记忆模块：</p>\n<ul class=\"md-list\"><li>自动记录每次路线规划交互</li><li>学习用户偏好的出行方式</li><li>支持多轮追问调整</li></ul>"}, {"title": "Multi-turn Support", "html": "<ul class=\"md-list\"><li>\"太贵了，有没有便宜点的？\" → 优先推荐公交/地铁</li><li>\"赶时间\" → 推荐最快方案</li><li>\"下雨了怎么办？\" → 推荐打车</li><li>\"就坐这个\" → 记录选择</li></ul>"}, {"title": "配图（推荐景点时执行）", "html": "<p class=\"md-p\">当推荐涉及景点/目的地时，附带一张图片。</p>\n<h3 class=\"md-h3\">主力方案：Wikipedia API</h3>\n<p class=\"md-p\">使用 <code class=\"inline-code\">core/wiki_image.py</code> 获取图片，速度快、URL 稳定。</p>\n<pre class=\"code-block\"><code class=\"lang-bash\">python {baseDir}/../core/wiki_image.py \"&lt;景点名称&gt;\"</code></pre>\n<ul class=\"md-list\"><li>返回 <code class=\"inline-code\">image_url</code> 直链，用 <code class=\"inline-code\">message</code> 工具发送</li><li>同时返回 <code class=\"inline-code\">summary</code>（简介）和 <code class=\"inline-code\">wiki_url</code>（页面链接）</li><li>多个景点时并行调用</li></ul>\n<h3 class=\"md-h3\">兜底：web_search</h3>\n<p class=\"md-p\">当 wiki<em>image 返回 <code class=\"inline-code\">found: false</code> 时，用 web</em>search 搜索，<strong>必须用 <code class=\"inline-code\">site:</code> 限定可信站点</strong>：</p>\n<ul class=\"md-list\"><li><code class=\"inline-code\">web_search(\"<景点名> 实景图 site:ctrip.com\")</code></li><li>备选：<code class=\"inline-code\">site:mafengwo.cn</code>（马蜂窝）</li></ul>\n<p class=\"md-p\">从结果页面中提取图片 URL。优先用可信站点的结果，不要用未知来源的图片。</p>\n<h3 class=\"md-h3\">适用场景</h3>\n<ul class=\"md-list\"><li>推荐景点目的地时 → 必须用 wiki_image 搜图</li><li>纯路线规划（A到B）→ 不需要图</li><li>每个景点最多 1 张图</li><li>搜不到图片时直接跳过，文字推荐照常输出</li></ul>\n<h3 class=\"md-h3\">⚠️ 搜了就必须发（防浪费规则）</h3>\n<ul class=\"md-list\"><li>如果已经调用了 <code class=\"inline-code\">wiki<em>image.py</code> 并且返回 <code class=\"inline-code\">found: true</code> 且 <code class=\"inline-code\">image</em>url</code> 不为空，<strong>必须用 message 工具把这张图发出去</strong></li><li>搜了不发 = 白搜，浪费了一次 API 调用和用户等待时间</li><li>这条规则不强制每次都搜图，但如果搜了就必须发</li></ul>"}, {"title": "Constraints", "html": "<ul class=\"md-list\"><li>所有路线数据基于模拟数据集</li><li>不收集真实位置信息</li></ul>"}], "full_html": "<h1 class=\"md-h1\">Travel Planner Skill</h1>\n<h2 class=\"md-h2\">Description</h2>\n<p class=\"md-p\">本地出行规划技能。综合考虑时间、距离、费用、天气等因素，为用户推荐最优出行方案。集成记忆系统学习出行偏好。</p>\n<h2 class=\"md-h2\">Trigger</h2>\n<p class=\"md-p\">当用户提到：怎么去、路线、出行、打车、地铁、公交、导航、路上、交通等关键词时触发。</p>\n<h2 class=\"md-h2\">Input Parameters</h2>\n<ul class=\"md-list\"><li><code class=\"inline-code\">origin</code> (string): 出发地</li><li><code class=\"inline-code\">destination</code> (string): 目的地</li><li><code class=\"inline-code\">time</code> (string, optional): 出发时间或到达时间</li><li><code class=\"inline-code\">mode</code> (string, optional): 出行方式偏好 (walk/bus/subway/taxi/drive)</li><li><code class=\"inline-code\">priority</code> (string, optional): 优先考虑 (cost/time/comfort)</li><li><code class=\"inline-code\">query</code> (string, optional): 自然语言查询（多轮对话用）</li></ul>\n<h2 class=\"md-h2\">Script</h2>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 出行规划\npython {baseDir}/scripts/plan_route.py --origin \"&lt;origin&gt;\" --destination \"&lt;destination&gt;\" --time \"&lt;time&gt;\" --mode \"&lt;mode&gt;\"\n\n# 按优先级排序\npython {baseDir}/scripts/plan_route.py --origin \"&lt;origin&gt;\" --destination \"&lt;destination&gt;\" --priority \"cost\"\n\n# 记录用户选择\npython {baseDir}/scripts/plan_route.py --origin \"&lt;origin&gt;\" --destination \"&lt;destination&gt;\" --choice \"地铁\"\n\n# 查看上次推荐\npython {baseDir}/scripts/plan_route.py --origin \"x\" --destination \"y\" --recall\n\n# 获取景点/目的地的 Wikipedia 图片和简介\npython {baseDir}/../core/wiki_image.py \"&lt;景点名称&gt;\"</code></pre>\n<h2 class=\"md-h2\">Output</h2>\n<p class=\"md-p\">返回对比方案：</p>\n<ul class=\"md-list\"><li>多种出行方式的时间、费用、距离对比</li><li>推荐最优方案及理由</li><li>偏好提示（基于历史学习）</li><li>到达时间预估</li></ul>\n<h2 class=\"md-h2\">Memory System</h2>\n<p class=\"md-p\">集成 <code class=\"inline-code\">core/memory.py</code> 共享记忆模块：</p>\n<ul class=\"md-list\"><li>自动记录每次路线规划交互</li><li>学习用户偏好的出行方式</li><li>支持多轮追问调整</li></ul>\n<h2 class=\"md-h2\">Multi-turn Support</h2>\n<ul class=\"md-list\"><li>\"太贵了，有没有便宜点的？\" → 优先推荐公交/地铁</li><li>\"赶时间\" → 推荐最快方案</li><li>\"下雨了怎么办？\" → 推荐打车</li><li>\"就坐这个\" → 记录选择</li></ul>\n<h2 class=\"md-h2\">配图（推荐景点时执行）</h2>\n<p class=\"md-p\">当推荐涉及景点/目的地时，附带一张图片。</p>\n<h3 class=\"md-h3\">主力方案：Wikipedia API</h3>\n<p class=\"md-p\">使用 <code class=\"inline-code\">core/wiki_image.py</code> 获取图片，速度快、URL 稳定。</p>\n<pre class=\"code-block\"><code class=\"lang-bash\">python {baseDir}/../core/wiki_image.py \"&lt;景点名称&gt;\"</code></pre>\n<ul class=\"md-list\"><li>返回 <code class=\"inline-code\">image_url</code> 直链，用 <code class=\"inline-code\">message</code> 工具发送</li><li>同时返回 <code class=\"inline-code\">summary</code>（简介）和 <code class=\"inline-code\">wiki_url</code>（页面链接）</li><li>多个景点时并行调用</li></ul>\n<h3 class=\"md-h3\">兜底：web_search</h3>\n<p class=\"md-p\">当 wiki<em>image 返回 <code class=\"inline-code\">found: false</code> 时，用 web</em>search 搜索，<strong>必须用 <code class=\"inline-code\">site:</code> 限定可信站点</strong>：</p>\n<ul class=\"md-list\"><li><code class=\"inline-code\">web_search(\"<景点名> 实景图 site:ctrip.com\")</code></li><li>备选：<code class=\"inline-code\">site:mafengwo.cn</code>（马蜂窝）</li></ul>\n<p class=\"md-p\">从结果页面中提取图片 URL。优先用可信站点的结果，不要用未知来源的图片。</p>\n<h3 class=\"md-h3\">适用场景</h3>\n<ul class=\"md-list\"><li>推荐景点目的地时 → 必须用 wiki_image 搜图</li><li>纯路线规划（A到B）→ 不需要图</li><li>每个景点最多 1 张图</li><li>搜不到图片时直接跳过，文字推荐照常输出</li></ul>\n<h3 class=\"md-h3\">⚠️ 搜了就必须发（防浪费规则）</h3>\n<ul class=\"md-list\"><li>如果已经调用了 <code class=\"inline-code\">wiki<em>image.py</code> 并且返回 <code class=\"inline-code\">found: true</code> 且 <code class=\"inline-code\">image</em>url</code> 不为空，<strong>必须用 message 工具把这张图发出去</strong></li><li>搜了不发 = 白搜，浪费了一次 API 调用和用户等待时间</li><li>这条规则不强制每次都搜图，但如果搜了就必须发</li></ul>\n<h2 class=\"md-h2\">Constraints</h2>\n<ul class=\"md-list\"><li>所有路线数据基于模拟数据集</li><li>不收集真实位置信息</li></ul>"}, "sk_booking": {"key": "sk_booking", "label": "📋 booking", "sections": [{"title": "Description", "html": "<p class=\"md-p\">对话式预订技能。通过自然语言完成餐厅预订、活动报名等操作，替代传统 App 的表单填写流程。自动关联日程管理，模拟支付闭环。</p>"}, {"title": "Trigger", "html": "<p class=\"md-p\">当用户提到：订、预订、预约、留座、报名、定位子、订餐、book 等预订相关关键词时触发。</p>\n<p class=\"md-p\">也在用户通过 food-finder / entertainment 选定目标后自动衔接。</p>"}, {"title": "⚠️ 预订流程约束（硬约束）", "html": "<h3 class=\"md-h3\">必须确认的字段</h3>\n<p class=\"md-p\">预订前<strong>必须</strong>拥有以下信息，缺一不可：</p>\n<ul class=\"md-list\"><li><strong>目标</strong>：餐厅名/活动名（从上次推荐中获取或用户直接说）</li><li><strong>时间</strong>：具体日期和时段（必须用 date_resolver.py 解析）</li><li><strong>人数</strong>：几位</li></ul>\n<h3 class=\"md-h3\">流程</h3>\n<ol class=\"md-list\"><li>从对话中提取已有信息</li><li>缺少信息时<strong>逐项补问</strong>，不要一次问三个问题</li><li>信息完整后，生成预订确认卡片</li><li>用户确认后执行预订</li><li>自动创建日程条目</li><li><strong>预订成功后，必须在确认卡片末尾加上支付引导</strong>：<code class=\"inline-code\">回复「支付」即可完成付款</code>，让用户知道下一步操作</li></ol>\n<h3 class=\"md-h3\">禁止</h3>\n<ul class=\"md-list\"><li>禁止在信息不完整时直接创建预订</li><li>禁止跳过确认步骤</li><li>禁止自行推断时间（必须用 date_resolver.py）</li></ul>\n<h3 class=\"md-h3\">日期解析 fallback（硬约束）</h3>\n<p class=\"md-p\">用户提到的时间描述必须经过 <code class=\"inline-code\">date<em>resolver.resolve</em>date()</code> 转换为 ISO 日期后才能使用。</p>\n<ul class=\"md-list\"><li><strong>解析成功</strong> → 用返回的 ISO 日期继续流程</li><li><strong>解析失败（返回 None）</strong> → 向用户反问具体日期，禁止自行猜测。示例回复：\"你说的具体是哪天？给我一个日期就行，比如'6月10号'或者'下周六'\"</li><li><strong>模糊表达</strong>（\"月底\"、\"端午节\"、\"有空的时候\"）→ 同样反问，不要自行推算节假日或模糊时间</li></ul>"}, {"title": "Script", "html": "<pre class=\"code-block\"><code class=\"lang-bash\"># 创建预订\npython {baseDir}/scripts/booking_cli.py create --venue \"&lt;餐厅/场所名&gt;\" --date \"&lt;YYYY-MM-DD&gt;\" --time \"&lt;HH:MM&gt;\" --party_size &lt;人数&gt; --contact \"&lt;联系方式&gt;\" --notes \"&lt;备注&gt;\"\n\n# 查看预订列表\npython {baseDir}/scripts/booking_cli.py list\npython {baseDir}/scripts/booking_cli.py list --status pending\npython {baseDir}/scripts/booking_cli.py list --upcoming\n\n# 查看预订详情\npython {baseDir}/scripts/booking_cli.py detail &lt;booking_id&gt;\n\n# 取消预订\npython {baseDir}/scripts/booking_cli.py cancel &lt;booking_id&gt;\npython {baseDir}/scripts/booking_cli.py cancel --venue \"&lt;餐厅名&gt;\"\n\n# 模拟支付\npython {baseDir}/scripts/booking_cli.py pay &lt;booking_id&gt;\n\n# 标记已完成（到店消费后）\npython {baseDir}/scripts/booking_cli.py complete &lt;booking_id&gt;\n\n# 查看即将到来的预订（用于提醒）\npython {baseDir}/scripts/booking_cli.py remind</code></pre>"}, {"title": "Output", "html": "<p class=\"md-p\">返回结构化预订信息：</p>\n<ul class=\"md-list\"><li>预订确认卡片（场所、时间、人数、预估费用）</li><li>支付状态和模拟支付链接</li><li>自动创建的日程条目 ID</li><li>到店提醒信息</li></ul>"}, {"title": "与其他技能联动", "html": "<h3 class=\"md-h3\">food-finder → booking</h3>\n<p class=\"md-p\">用户说\"就去这家\" → food-finder 记录选择 → 自动询问是否预订</p>\n<h3 class=\"md-h3\">entertainment → booking</h3>\n<p class=\"md-p\">用户选定活动 → 自动询问是否报名/购票</p>\n<h3 class=\"md-h3\">booking → calendar</h3>\n<p class=\"md-p\">预订成功 → 自动在日历中创建对应日程</p>\n<h3 class=\"md-h3\">booking → review</h3>\n<p class=\"md-p\">预订完成（到店后）→ 触发 review 技能主动询问体验</p>"}, {"title": "Constraints", "html": "<ul class=\"md-list\"><li>所有数据为模拟数据，不调用真实预订 API</li><li>不收集真实用户个人信息</li><li>联系方式使用模拟数据或用户显式输入</li><li>支付为模拟流程，不涉及真实交易</li></ul>"}], "full_html": "<h1 class=\"md-h1\">Booking Skill</h1>\n<h2 class=\"md-h2\">Description</h2>\n<p class=\"md-p\">对话式预订技能。通过自然语言完成餐厅预订、活动报名等操作，替代传统 App 的表单填写流程。自动关联日程管理，模拟支付闭环。</p>\n<h2 class=\"md-h2\">Trigger</h2>\n<p class=\"md-p\">当用户提到：订、预订、预约、留座、报名、定位子、订餐、book 等预订相关关键词时触发。</p>\n<p class=\"md-p\">也在用户通过 food-finder / entertainment 选定目标后自动衔接。</p>\n<h2 class=\"md-h2\">⚠️ 预订流程约束（硬约束）</h2>\n<h3 class=\"md-h3\">必须确认的字段</h3>\n<p class=\"md-p\">预订前<strong>必须</strong>拥有以下信息，缺一不可：</p>\n<ul class=\"md-list\"><li><strong>目标</strong>：餐厅名/活动名（从上次推荐中获取或用户直接说）</li><li><strong>时间</strong>：具体日期和时段（必须用 date_resolver.py 解析）</li><li><strong>人数</strong>：几位</li></ul>\n<h3 class=\"md-h3\">流程</h3>\n<ol class=\"md-list\"><li>从对话中提取已有信息</li><li>缺少信息时<strong>逐项补问</strong>，不要一次问三个问题</li><li>信息完整后，生成预订确认卡片</li><li>用户确认后执行预订</li><li>自动创建日程条目</li><li><strong>预订成功后，必须在确认卡片末尾加上支付引导</strong>：<code class=\"inline-code\">回复「支付」即可完成付款</code>，让用户知道下一步操作</li></ol>\n<h3 class=\"md-h3\">禁止</h3>\n<ul class=\"md-list\"><li>禁止在信息不完整时直接创建预订</li><li>禁止跳过确认步骤</li><li>禁止自行推断时间（必须用 date_resolver.py）</li></ul>\n<h3 class=\"md-h3\">日期解析 fallback（硬约束）</h3>\n<p class=\"md-p\">用户提到的时间描述必须经过 <code class=\"inline-code\">date<em>resolver.resolve</em>date()</code> 转换为 ISO 日期后才能使用。</p>\n<ul class=\"md-list\"><li><strong>解析成功</strong> → 用返回的 ISO 日期继续流程</li><li><strong>解析失败（返回 None）</strong> → 向用户反问具体日期，禁止自行猜测。示例回复：\"你说的具体是哪天？给我一个日期就行，比如'6月10号'或者'下周六'\"</li><li><strong>模糊表达</strong>（\"月底\"、\"端午节\"、\"有空的时候\"）→ 同样反问，不要自行推算节假日或模糊时间</li></ul>\n<h2 class=\"md-h2\">Script</h2>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 创建预订\npython {baseDir}/scripts/booking_cli.py create --venue \"&lt;餐厅/场所名&gt;\" --date \"&lt;YYYY-MM-DD&gt;\" --time \"&lt;HH:MM&gt;\" --party_size &lt;人数&gt; --contact \"&lt;联系方式&gt;\" --notes \"&lt;备注&gt;\"\n\n# 查看预订列表\npython {baseDir}/scripts/booking_cli.py list\npython {baseDir}/scripts/booking_cli.py list --status pending\npython {baseDir}/scripts/booking_cli.py list --upcoming\n\n# 查看预订详情\npython {baseDir}/scripts/booking_cli.py detail &lt;booking_id&gt;\n\n# 取消预订\npython {baseDir}/scripts/booking_cli.py cancel &lt;booking_id&gt;\npython {baseDir}/scripts/booking_cli.py cancel --venue \"&lt;餐厅名&gt;\"\n\n# 模拟支付\npython {baseDir}/scripts/booking_cli.py pay &lt;booking_id&gt;\n\n# 标记已完成（到店消费后）\npython {baseDir}/scripts/booking_cli.py complete &lt;booking_id&gt;\n\n# 查看即将到来的预订（用于提醒）\npython {baseDir}/scripts/booking_cli.py remind</code></pre>\n<h2 class=\"md-h2\">Output</h2>\n<p class=\"md-p\">返回结构化预订信息：</p>\n<ul class=\"md-list\"><li>预订确认卡片（场所、时间、人数、预估费用）</li><li>支付状态和模拟支付链接</li><li>自动创建的日程条目 ID</li><li>到店提醒信息</li></ul>\n<h2 class=\"md-h2\">与其他技能联动</h2>\n<h3 class=\"md-h3\">food-finder → booking</h3>\n<p class=\"md-p\">用户说\"就去这家\" → food-finder 记录选择 → 自动询问是否预订</p>\n<h3 class=\"md-h3\">entertainment → booking</h3>\n<p class=\"md-p\">用户选定活动 → 自动询问是否报名/购票</p>\n<h3 class=\"md-h3\">booking → calendar</h3>\n<p class=\"md-p\">预订成功 → 自动在日历中创建对应日程</p>\n<h3 class=\"md-h3\">booking → review</h3>\n<p class=\"md-p\">预订完成（到店后）→ 触发 review 技能主动询问体验</p>\n<h2 class=\"md-h2\">Constraints</h2>\n<ul class=\"md-list\"><li>所有数据为模拟数据，不调用真实预订 API</li><li>不收集真实用户个人信息</li><li>联系方式使用模拟数据或用户显式输入</li><li>支付为模拟流程，不涉及真实交易</li></ul>"}, "sk_review": {"key": "sk_review", "label": "💬 review", "sections": [{"title": "Description", "html": "<p class=\"md-p\">对话式评价技能。用户随口一句话就能完成评价，替代传统 App 中\"打星 + 写评论 + 上传照片\"的多步骤流程。评价结果自动融入偏好学习系统，直接影响下次推荐。</p>"}, {"title": "Trigger", "html": "<ul class=\"md-list\"><li>用户主动评价：\"上次那家不错\"、\"那个烧烤太咸了\"、\"昨天的电影一般\"</li><li>预订完成后主动询问</li><li>心跳任务中检测到待评价的已完成预订</li></ul>"}, {"title": "⚠️ 评价交互约束", "html": "<h3 class=\"md-h3\">主动询问规则</h3>\n<ul class=\"md-list\"><li>预订完成当天或次日，<strong>主动询问一次</strong>体验如何</li><li>用户回复后立即记录，<strong>不要追问细节</strong></li><li>用户不回复或说\"还行\"/\"一般\" → 记录中性评价，不追问</li></ul>\n<h3 class=\"md-h3\">评价解析</h3>\n<p class=\"md-p\">从自然语言中提取：</p>\n<ul class=\"md-list\"><li><strong>情感倾向</strong>：正面/中性/负面</li><li><strong>具体属性</strong>：口味、服务、环境、价格、位置等</li><li><strong>关键词</strong>：辣、咸、安静、排队、便宜等</li></ul>\n<h3 class=\"md-h3\">禁止</h3>\n<ul class=\"md-list\"><li>禁止要求用户打1-5星（这是传统App的交互方式）</li><li>禁止要求用户写长评（简短对话就够了）</li><li>禁止同一次体验反复追问</li></ul>"}, {"title": "Script", "html": "<pre class=\"code-block\"><code class=\"lang-bash\"># 记录评价（从自然语言解析）\npython {baseDir}/scripts/review_cli.py add --venue \"&lt;餐厅/活动名&gt;\" --comment \"&lt;用户原话&gt;\" --skill \"&lt;food-finder|entertainment&gt;\"\n\n# 记录评价并关联预订\npython {baseDir}/scripts/review_cli.py add --venue \"&lt;名称&gt;\" --comment \"&lt;评价&gt;\" --booking_id \"&lt;BK...&gt;\"\n\n# 查看评价历史\npython {baseDir}/scripts/review_cli.py list\npython {baseDir}/scripts/review_cli.py list --venue \"&lt;名称&gt;\"\npython {baseDir}/scripts/review_cli.py list --sentiment negative\n\n# 查看待评价列表（关联 booking）\npython {baseDir}/scripts/review_cli.py pending\n\n# 偏好影响摘要\npython {baseDir}/scripts/review_cli.py impact</code></pre>"}, {"title": "Output", "html": "<ul class=\"md-list\"><li>评价确认消息（简短，一句话）</li><li>偏好更新提示（如\"记住了，下次少推荐辣的\"）</li><li>评价历史列表</li></ul>"}, {"title": "与偏好学习的关系", "html": "<h3 class=\"md-h3\">正面评价 → 强化偏好</h3>\n<p class=\"md-p\">\"那家日料很好吃\" → preferred_cuisines[\"日料\"] 权重 +1</p>\n<h3 class=\"md-h3\">负面评价 → 抑制偏好</h3>\n<p class=\"md-p\">\"太辣了受不了\" → rejected<em>food</em>tags[\"辣\"] 权重 +1</p>\n<p class=\"md-p\">\"环境太吵\" → rejected_environments[\"noisy\"] +1</p>\n<h3 class=\"md-h3\">属性评价 → 细化偏好画像</h3>\n<p class=\"md-p\">\"服务特别好\" → preferred<em>food</em>tags[\"服务好\"] +1</p>\n<p class=\"md-p\">\"性价比高\" → preferred_budgets[\"low/medium\"] +1</p>"}, {"title": "与其他技能联动", "html": "<h3 class=\"md-h3\">booking → review</h3>\n<p class=\"md-p\">预订标记 complete → review 检测到待评价 → 主动询问</p>\n<h3 class=\"md-h3\">review → memory.py</h3>\n<p class=\"md-p\">评价结果 → 调用 record<em>rejection() 或 </em>update<em>preferences</em>from_choice()</p>\n<h3 class=\"md-h3\">review → food-finder / entertainment</h3>\n<p class=\"md-p\">下次推荐时，search() 自动读取更新后的偏好</p>"}, {"title": "Constraints", "html": "<ul class=\"md-list\"><li>不收集真实用户信息</li><li>评价数据仅用于本地偏好学习</li><li>保留最近 200 条评价记录</li></ul>"}], "full_html": "<h1 class=\"md-h1\">Review Skill</h1>\n<h2 class=\"md-h2\">Description</h2>\n<p class=\"md-p\">对话式评价技能。用户随口一句话就能完成评价，替代传统 App 中\"打星 + 写评论 + 上传照片\"的多步骤流程。评价结果自动融入偏好学习系统，直接影响下次推荐。</p>\n<h2 class=\"md-h2\">Trigger</h2>\n<ul class=\"md-list\"><li>用户主动评价：\"上次那家不错\"、\"那个烧烤太咸了\"、\"昨天的电影一般\"</li><li>预订完成后主动询问</li><li>心跳任务中检测到待评价的已完成预订</li></ul>\n<h2 class=\"md-h2\">⚠️ 评价交互约束</h2>\n<h3 class=\"md-h3\">主动询问规则</h3>\n<ul class=\"md-list\"><li>预订完成当天或次日，<strong>主动询问一次</strong>体验如何</li><li>用户回复后立即记录，<strong>不要追问细节</strong></li><li>用户不回复或说\"还行\"/\"一般\" → 记录中性评价，不追问</li></ul>\n<h3 class=\"md-h3\">评价解析</h3>\n<p class=\"md-p\">从自然语言中提取：</p>\n<ul class=\"md-list\"><li><strong>情感倾向</strong>：正面/中性/负面</li><li><strong>具体属性</strong>：口味、服务、环境、价格、位置等</li><li><strong>关键词</strong>：辣、咸、安静、排队、便宜等</li></ul>\n<h3 class=\"md-h3\">禁止</h3>\n<ul class=\"md-list\"><li>禁止要求用户打1-5星（这是传统App的交互方式）</li><li>禁止要求用户写长评（简短对话就够了）</li><li>禁止同一次体验反复追问</li></ul>\n<h2 class=\"md-h2\">Script</h2>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 记录评价（从自然语言解析）\npython {baseDir}/scripts/review_cli.py add --venue \"&lt;餐厅/活动名&gt;\" --comment \"&lt;用户原话&gt;\" --skill \"&lt;food-finder|entertainment&gt;\"\n\n# 记录评价并关联预订\npython {baseDir}/scripts/review_cli.py add --venue \"&lt;名称&gt;\" --comment \"&lt;评价&gt;\" --booking_id \"&lt;BK...&gt;\"\n\n# 查看评价历史\npython {baseDir}/scripts/review_cli.py list\npython {baseDir}/scripts/review_cli.py list --venue \"&lt;名称&gt;\"\npython {baseDir}/scripts/review_cli.py list --sentiment negative\n\n# 查看待评价列表（关联 booking）\npython {baseDir}/scripts/review_cli.py pending\n\n# 偏好影响摘要\npython {baseDir}/scripts/review_cli.py impact</code></pre>\n<h2 class=\"md-h2\">Output</h2>\n<ul class=\"md-list\"><li>评价确认消息（简短，一句话）</li><li>偏好更新提示（如\"记住了，下次少推荐辣的\"）</li><li>评价历史列表</li></ul>\n<h2 class=\"md-h2\">与偏好学习的关系</h2>\n<h3 class=\"md-h3\">正面评价 → 强化偏好</h3>\n<p class=\"md-p\">\"那家日料很好吃\" → preferred_cuisines[\"日料\"] 权重 +1</p>\n<h3 class=\"md-h3\">负面评价 → 抑制偏好</h3>\n<p class=\"md-p\">\"太辣了受不了\" → rejected<em>food</em>tags[\"辣\"] 权重 +1</p>\n<p class=\"md-p\">\"环境太吵\" → rejected_environments[\"noisy\"] +1</p>\n<h3 class=\"md-h3\">属性评价 → 细化偏好画像</h3>\n<p class=\"md-p\">\"服务特别好\" → preferred<em>food</em>tags[\"服务好\"] +1</p>\n<p class=\"md-p\">\"性价比高\" → preferred_budgets[\"low/medium\"] +1</p>\n<h2 class=\"md-h2\">与其他技能联动</h2>\n<h3 class=\"md-h3\">booking → review</h3>\n<p class=\"md-p\">预订标记 complete → review 检测到待评价 → 主动询问</p>\n<h3 class=\"md-h3\">review → memory.py</h3>\n<p class=\"md-p\">评价结果 → 调用 record<em>rejection() 或 </em>update<em>preferences</em>from_choice()</p>\n<h3 class=\"md-h3\">review → food-finder / entertainment</h3>\n<p class=\"md-p\">下次推荐时，search() 自动读取更新后的偏好</p>\n<h2 class=\"md-h2\">Constraints</h2>\n<ul class=\"md-list\"><li>不收集真实用户信息</li><li>评价数据仅用于本地偏好学习</li><li>保留最近 200 条评价记录</li></ul>"}, "sk_scheduler": {"key": "sk_scheduler", "label": "🧭 scheduler", "sections": [{"title": "Description", "html": "<p class=\"md-p\">智能行程编排技能。当用户要\"安排某天/一日游/规划行程\"且涉及 <strong>2 个及以上</strong> 候选地点时，把候选交给排期器，由它计算出行时间、优化游览顺序、自动插入午晚餐、估算预算，输出一条微信友好的时间线。算法是纯代码（<code class=\"inline-code\">core/scheduler.py</code>），不含 LLM。</p>"}, {"title": "Trigger", "html": "<p class=\"md-p\">当用户提到：安排周末/某天、一日游、帮我规划行程、怎么玩、路线安排、几个地方怎么排等，<strong>且已有/将有多个候选地点</strong>时触发。</p>"}, {"title": "⚠️ 核心硬约束：不要自己心算时间线", "html": "<p class=\"md-p\">时间线 = 事实性数据（出行分钟、游览顺序、总花费），和日期、坐标一样——<strong>必须从工具拿，禁止 LLM 自行推算</strong>。</p>\n<ul class=\"md-list\"><li><strong>禁止</strong>自己编造\"X 点到 Y 点\"的时间安排</li><li><strong>禁止</strong>把排期器算出的时间、花费改写成别的数字</li><li>多地点行程<strong>一律</strong>走 <code class=\"inline-code\">schedule_cli.py</code>；单个地点或纯推荐不需要排期，直接答即可</li></ul>"}, {"title": "流程", "html": "<ol class=\"md-list\"><li>先用 entertainment / food-finder 搜出候选（它们输出含 <code class=\"inline-code\">location</code> 坐标的 JSON）</li><li>组装成 schedule 输入 JSON，喂给排期器</li><li>把输出<strong>原样转发</strong>给用户（已是微信格式），可在前面加一句自己的话</li></ol>"}, {"title": "Script", "html": "<pre class=\"code-block\"><code class=\"lang-bash\"># 从 stdin 读候选 JSON（最常用）\necho '&lt;候选JSON&gt;' | python {baseDir}/scripts/schedule_cli.py --input -\n\n# 从文件读\npython {baseDir}/scripts/schedule_cli.py --input plan.json\n\n# 结构化输出（程序处理用）\npython {baseDir}/scripts/schedule_cli.py --input - --json\n\n# 跑内置样例（济南一日游）\npython {baseDir}/scripts/schedule_cli.py --demo</code></pre>\n<h3 class=\"md-h3\">输入 JSON 结构</h3>\n<pre class=\"code-block\"><code class=\"lang-json\">{\n  \"events\": [\n    {\"name\":\"趵突泉\",\"type\":\"outdoor\",\"location\":\"116.997,36.664\",\n     \"duration_min\":90,\"price_yuan\":40,\"rating\":4.7}\n  ],\n  \"lunch\":  [{\"name\":\"草包包子铺\",\"cuisine\":\"面食\",\"location\":\"117.02,36.67\"}],\n  \"dinner\": [{\"name\":\"城南往事\",\"cuisine\":\"鲁菜\"}],\n  \"start_hour\": 9\n}</code></pre>\n<ul class=\"md-list\"><li><code class=\"inline-code\">events</code> 必填（≥1），<code class=\"inline-code\">location</code> 用高德 \"lng,lat\" 字符串，缺坐标也能跑（降级到默认出行时间）</li><li><code class=\"inline-code\">lunch</code>/<code class=\"inline-code\">dinner</code>/<code class=\"inline-code\">start_hour</code> 可选</li></ul>"}, {"title": "Output", "html": "<p class=\"md-p\">默认输出格式化时间线文本（适配微信，已遵循禁 markdown 加粗/禁带数字 emoji），加 <code class=\"inline-code\">--json</code> 输出结构化结果。</p>"}, {"title": "排期器做了什么（core/scheduler.py）", "html": "<ol class=\"md-list\"><li>并行用坐标计算活动间实际出行时间矩阵（高德 API，失败降级距离估算）</li><li>贪心算法优化游览顺序，最小化总出行时间</li><li>在 11:00-14:00 / 17:00-21:00 自动插入午/晚餐</li><li>按营业时间校验，估算总预算</li><li>输出带时间戳的完整时间线 + 统计摘要</li></ol>"}, {"title": "与其他技能联动", "html": "<ul class=\"md-list\"><li><strong>entertainment / food-finder → scheduler</strong>：搜出候选 → 排期成时间线</li><li><strong>scheduler → booking</strong>：用户对某条时间线满意 → 自然衔接\"要帮你把这几家都订了吗\"</li><li><strong>scheduler → calendar</strong>：确定行程后可逐项写入日历</li></ul>"}, {"title": "Constraints", "html": "<ul class=\"md-list\"><li>所有排期通过 <code class=\"inline-code\">schedule_cli.py</code>，不直接操作 scheduler.py 内部函数</li><li>用 <code class=\"inline-code\">exec</code> 工具调用脚本，输出原样转发，禁止改写时间/花费</li></ul>"}], "full_html": "<h1 class=\"md-h1\">Scheduler Skill</h1>\n<h2 class=\"md-h2\">Description</h2>\n<p class=\"md-p\">智能行程编排技能。当用户要\"安排某天/一日游/规划行程\"且涉及 <strong>2 个及以上</strong> 候选地点时，把候选交给排期器，由它计算出行时间、优化游览顺序、自动插入午晚餐、估算预算，输出一条微信友好的时间线。算法是纯代码（<code class=\"inline-code\">core/scheduler.py</code>），不含 LLM。</p>\n<h2 class=\"md-h2\">Trigger</h2>\n<p class=\"md-p\">当用户提到：安排周末/某天、一日游、帮我规划行程、怎么玩、路线安排、几个地方怎么排等，<strong>且已有/将有多个候选地点</strong>时触发。</p>\n<h2 class=\"md-h2\">⚠️ 核心硬约束：不要自己心算时间线</h2>\n<p class=\"md-p\">时间线 = 事实性数据（出行分钟、游览顺序、总花费），和日期、坐标一样——<strong>必须从工具拿，禁止 LLM 自行推算</strong>。</p>\n<ul class=\"md-list\"><li><strong>禁止</strong>自己编造\"X 点到 Y 点\"的时间安排</li><li><strong>禁止</strong>把排期器算出的时间、花费改写成别的数字</li><li>多地点行程<strong>一律</strong>走 <code class=\"inline-code\">schedule_cli.py</code>；单个地点或纯推荐不需要排期，直接答即可</li></ul>\n<h2 class=\"md-h2\">流程</h2>\n<ol class=\"md-list\"><li>先用 entertainment / food-finder 搜出候选（它们输出含 <code class=\"inline-code\">location</code> 坐标的 JSON）</li><li>组装成 schedule 输入 JSON，喂给排期器</li><li>把输出<strong>原样转发</strong>给用户（已是微信格式），可在前面加一句自己的话</li></ol>\n<h2 class=\"md-h2\">Script</h2>\n<pre class=\"code-block\"><code class=\"lang-bash\"># 从 stdin 读候选 JSON（最常用）\necho '&lt;候选JSON&gt;' | python {baseDir}/scripts/schedule_cli.py --input -\n\n# 从文件读\npython {baseDir}/scripts/schedule_cli.py --input plan.json\n\n# 结构化输出（程序处理用）\npython {baseDir}/scripts/schedule_cli.py --input - --json\n\n# 跑内置样例（济南一日游）\npython {baseDir}/scripts/schedule_cli.py --demo</code></pre>\n<h3 class=\"md-h3\">输入 JSON 结构</h3>\n<pre class=\"code-block\"><code class=\"lang-json\">{\n  \"events\": [\n    {\"name\":\"趵突泉\",\"type\":\"outdoor\",\"location\":\"116.997,36.664\",\n     \"duration_min\":90,\"price_yuan\":40,\"rating\":4.7}\n  ],\n  \"lunch\":  [{\"name\":\"草包包子铺\",\"cuisine\":\"面食\",\"location\":\"117.02,36.67\"}],\n  \"dinner\": [{\"name\":\"城南往事\",\"cuisine\":\"鲁菜\"}],\n  \"start_hour\": 9\n}</code></pre>\n<ul class=\"md-list\"><li><code class=\"inline-code\">events</code> 必填（≥1），<code class=\"inline-code\">location</code> 用高德 \"lng,lat\" 字符串，缺坐标也能跑（降级到默认出行时间）</li><li><code class=\"inline-code\">lunch</code>/<code class=\"inline-code\">dinner</code>/<code class=\"inline-code\">start_hour</code> 可选</li></ul>\n<h2 class=\"md-h2\">Output</h2>\n<p class=\"md-p\">默认输出格式化时间线文本（适配微信，已遵循禁 markdown 加粗/禁带数字 emoji），加 <code class=\"inline-code\">--json</code> 输出结构化结果。</p>\n<h2 class=\"md-h2\">排期器做了什么（core/scheduler.py）</h2>\n<ol class=\"md-list\"><li>并行用坐标计算活动间实际出行时间矩阵（高德 API，失败降级距离估算）</li><li>贪心算法优化游览顺序，最小化总出行时间</li><li>在 11:00-14:00 / 17:00-21:00 自动插入午/晚餐</li><li>按营业时间校验，估算总预算</li><li>输出带时间戳的完整时间线 + 统计摘要</li></ol>\n<h2 class=\"md-h2\">与其他技能联动</h2>\n<ul class=\"md-list\"><li><strong>entertainment / food-finder → scheduler</strong>：搜出候选 → 排期成时间线</li><li><strong>scheduler → booking</strong>：用户对某条时间线满意 → 自然衔接\"要帮你把这几家都订了吗\"</li><li><strong>scheduler → calendar</strong>：确定行程后可逐项写入日历</li></ul>\n<h2 class=\"md-h2\">Constraints</h2>\n<ul class=\"md-list\"><li>所有排期通过 <code class=\"inline-code\">schedule_cli.py</code>，不直接操作 scheduler.py 内部函数</li><li>用 <code class=\"inline-code\">exec</code> 工具调用脚本，输出原样转发，禁止改写时间/花费</li></ul>"}};
