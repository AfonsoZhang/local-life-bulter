name: skills-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 校验 SKILL.md 规范与文档-代码一致性
        run: python3 tools/check_skills.py
